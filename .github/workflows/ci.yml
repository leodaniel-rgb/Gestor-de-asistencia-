name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo privilegio: la CI solo lee el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # v5 detecta "packageManager": "pnpm@..." e intenta cachear con pnpm
          # antes de que exista en el runner. pnpm se activa en el paso siguiente.
          package-manager-cache: false

      # Usa la versión de pnpm fijada en package.json ("packageManager").
      - run: corepack enable

      - run: pnpm install --frozen-lockfile
      # Valores ficticios: el build valida el formato de las variables públicas,
      # pero la CI nunca se conecta a Supabase ni usa llaves reales.
      - name: Variables ficticias para el build
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://ci.supabase.invalid" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
